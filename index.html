<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立聯合大學 常用學生網址導覽</title>
    <!-- 引用同目錄下的 CSS 檔案 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 頁首 header -->
    <header class="main-header">
        <div class="header-container">
            <h1 class="logo-title">國立聯合大學</h1>
            <p class="subtitle">National United University — 學生常用系統快速連結</p>
        </div>
    </header>

    <!-- 主要內容區塊 -->
    <main class="main-content">
        <section class="card-grid">

            <!-- 1. 聯合大學校網 -->
            <a href="https://www.nuu.edu.tw/" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="card-icon">🏛️</div>
                <div class="card-info">
                    <h2>聯合大學校網</h2>
                    <p>學校官方首頁、最新公告與行政單位資訊</p>
                </div>
                <span class="btn-arrow">前往 &rarr;</span>
            </a>

            <!-- 2. 聯合大學學生入口 -->
            <a href="https://eap10.nuu.edu.tw/Login.aspx?logintype=S" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="card-icon">🎓</div>
                <div class="card-info">
                    <h2>學生資訊入口網</h2>
                    <p>選課系統、成績查詢、學籍資料管理</p>
                </div>
                <span class="btn-arrow">登入 &rarr;</span>
            </a>

            <!-- 3. 微課程系統 -->
            <a href="https://sso.nuu.edu.tw/login.php" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="card-icon">🧩</div>
                <div class="card-info">
                    <h2>微課程系統</h2>
                    <p>自主學習、微學分課程報名與紀錄查詢</p>
                </div>
                <span class="btn-arrow">登入 &rarr;</span>
            </a>

            <!-- 4. 數位校園系統 -->
            <a href="https://sso.nuu.edu.tw/login.php" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="card-icon">💻</div>
                <div class="card-info">
                    <h2>數位校園系統 (SSO)</h2>
                    <p>單一入口驗證、線上教學平台與校園數位資源</p>
                </div>
                <span class="btn-arrow">登入 &rarr;</span>
            </a>

        </section>
    </main>

    <!-- 頁尾 footer -->
    <footer class="main-footer">
        <p>&copy; 國立聯合大學 National United University</p>
    </footer>

</body>
</html>
